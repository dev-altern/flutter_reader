name: flutter_reader
description: "A high-performance scrollable reader widget with O(log N) jump-to-item, automatic height measurement, lazy-loading, and full-text search."
version: 1.0.0
homepage: https://github.com/dev-altern/flutter_reader
repository: https://github.com/dev-altern/flutter_reader
issue_tracker: https://github.com/dev-altern/flutter_reader/issues

topics:
  - scroll
  - reader
  - widgets
  - performance

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  reader_engine:
    git:
      url: https://github.com/dev-altern/reader_engine.git
      ref: main
  # When published to pub.dev, replace the git dependency above with:
  #   reader_engine: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
